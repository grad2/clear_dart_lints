name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Resolve package and example dependencies
        run: |
          dart pub get
          cd example
          flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib bin test tool example/lib
      - name: Analyze the package
        run: dart analyze --fatal-infos
      - name: Test architecture policies, setup audit and optional styles
        run: dart test
      - name: Verify the native plugin on isolated example fixtures
        run: dart run tool/verify_example.dart
