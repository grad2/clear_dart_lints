name: clear_dart_lints
description: Strict, configurable Dart and Flutter architecture linting with ready-to-use templates for coding agents and CI.
version: 0.6.2
repository: https://github.com/grad2/clear_dart_lints
homepage: https://github.com/grad2/clear_dart_lints
issue_tracker: https://github.com/grad2/clear_dart_lints/issues
topics:
  - lints
  - analyzer
  - architecture
  - flutter
  - agents
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  analysis_server_plugin: ^0.3.24
  analyzer: ^14.5.0
  analyzer_plugin: ^0.14.18
  dart_style: ^3.1.14
  glob: ^2.1.3
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3
dev_dependencies:
  build_runner: ^2.15.1
  injectable: ^3.0.0
  lints: ^6.1.0
  mobx: ^2.7.0
  mobx_codegen: ^2.7.8
  riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  riverpod_generator: ^4.0.9
  test: ^1.29.0
