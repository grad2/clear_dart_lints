schema_version: 2
include: ['lib/**']
exclude: ['lib/excluded_conventions.dart']
layers:
  example: ['lib/*.dart', 'lib/parts/**']
  data: ['lib/data/**']
roles:
  repository:
    names: ['ItemRepository', 'ItemRepositoryImpl']
    libraries: ['lib/new_rules.dart']
  manager:
    names: ['ItemsBloc']
    libraries: ['lib/new_rules.dart']
rules:
  layer_dependencies:
    allowed:
      - from: [example]
        to: [example]
        uris: ['dart:*', 'package:flutter/**']
  role_dependencies:
    restrictions:
      - source_layers: [example]
        dependency_roles: [repository]
        allowed_consumer_roles: [manager]
  depend_on_contracts:
    source_layers: [example]
    dependency_roles: [repository]
  constructor_injection:
    source_layers: [example]
    dependency_roles: [repository]
  forbidden_symbols:
    source_layers: [example]
    symbols:
      - library: dart:convert
        name: jsonEncode
